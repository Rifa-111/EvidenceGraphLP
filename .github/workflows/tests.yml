name: Offline tests and syntax

on:
  push:
    branches: [main, fix/release-audit-2026-11]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install pytest biopython
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run mocked PubMed tests (offline)
        run: python -m pytest -q tests/test_fetch_pubmed.py
